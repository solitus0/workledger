interface:
  display_name: "Session Worklog Creator"
  short_description: "Log session work with evidence-based descriptions"
  default_prompt: "Use $session-worklog-creator to create local workledger worklogs from the current session. Include only the duration, for example 1h30m. Derive the issue from the current branch when available and generate a descriptive entry from session work evidence. Never ask for a description; create nothing if the session contains no work evidence."
